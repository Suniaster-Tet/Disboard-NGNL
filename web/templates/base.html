<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f7f7f9; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #9b2247; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: .5rem; border-bottom: 1px solid #eee; text-align: left; }
    .badge { padding: .1rem .4rem; border-radius: .25rem; color: white; font-size: .8rem; }
    .badge-red { background: #b91c1c; }
    .badge-orange { background: #ea580c; }
    .badge-yellow { background: #ca8a04; }
    .badge-green { background: #15803d; }
    .progress { background: #e5e7eb; height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { background: #1e5b4f; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>{{ app_name }}</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/edges">Edges</a>
      <a href="/edges/new">Nuevo edge</a>
      <a href="/agenda">Agenda</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
