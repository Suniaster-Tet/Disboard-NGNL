# =============================================================================
# Disboard-NGNL — orquestación local
#   - devcontainer: entorno científico (Elkia)
#   - web: servidor LangGraph + dashboard
#   - cloudflared: túnel opcional para acceso remoto (perfil "tunnel")
# =============================================================================
services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: disboard-ngnl:dev
    container_name: disboard-dev
    working_dir: /workspaces/Disboard-NGNL
    volumes:
      - .:/workspaces/Disboard-NGNL:cached
    env_file:
      - .env
    command: sleep infinity
    healthcheck:
      test: ["CMD", "bash", "-lc", "python --version && latexmk --version >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - disboard

  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: disboard-ngnl:dev
    container_name: disboard-web
    working_dir: /workspaces/Disboard-NGNL
    volumes:
      - .:/workspaces/Disboard-NGNL:cached
    env_file:
      - .env
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - DISBOARD_WEB_REQUIRE_AUTH=true
      - DISBOARD_WEB_TRUST_PROXY_HEADERS=true
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn web.server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:8000/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - disboard

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: disboard-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - disboard

networks:
  disboard:
    driver: bridge
