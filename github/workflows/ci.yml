name: Cross-platform and browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install fastapi httpx python-multipart pandas openpyxl pypdf reportlab requests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile application modules
        run: python -m py_compile disboard_console.py disboard_graph.py disboard_web.py disboard_pdf_to_markdown.py disboard_skills.py disboard_registry.py elkia_architect.py disboard_artifacts.py disboard_plugins.py disboard_relay.py kuhaku_pipeline.py edge-bases_de_datos/src/disboard_data.py

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runner
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium, Firefox, and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Smoke-test the local web UI across browser engines
        run: python tests/browser_smoke.py

  mermaid-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.4.2
      - name: Render documentation diagrams
        run: python tests/render_mermaid.py
